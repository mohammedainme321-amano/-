<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وحي السماء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-50:#e0f2fe; --sky-600:#0284c7; --sky-800:#075985;
  --bg-top:#e0f2fe; --bg-bottom:#ffffff;
  --surface:#ffffff; --text:#0c2a3f; --muted:#4b6a80; --line:#bae0f5;
  --red:#d92d20; --red-bg:#fff1f0; --red-line:#f7b4ae;
  --amber:#b45309;
  --shadow:0 6px 24px rgba(2,132,199,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-top:#08334d; --bg-bottom:#0a1620;
    --surface:#10263a; --text:#e6f3fb; --muted:#9bb9cc; --line:#1f4a68;
    --red:#ff6b5e; --red-bg:#3a1714; --red-line:#7a2c26; --amber:#f5b25c;
    --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-top:#08334d; --bg-bottom:#0a1620;
  --surface:#10263a; --text:#e6f3fb; --muted:#9bb9cc; --line:#1f4a68;
  --red:#ff6b5e; --red-bg:#3a1714; --red-line:#7a2c26; --amber:#f5b25c;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
  color:var(--text);
  background:var(--bg-bottom) linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 70%) no-repeat;
  line-height:1.7;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-top)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky-600);outline-offset:3px;border-radius:8px}

/* Header: title only, centered */
.site-header{text-align:center;padding:2.5rem 1rem 1rem}
.site-header h1{margin:0;font-size:clamp(2.4rem,7vw,3.6rem);font-weight:800;color:var(--sky-800);letter-spacing:0}
.site-header .en{margin:.1rem 0 0;font-size:1.05rem;font-weight:500;color:var(--sky-600);direction:ltr}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .site-header h1{color:#7cc8f2}}

main{max-width:1040px;margin:0 auto;padding:1rem 1rem 3rem}
.view[hidden]{display:none}

/* Notification center */
.alerts{background:var(--surface);border:1.5px solid var(--red-line);border-radius:18px;box-shadow:var(--shadow);margin:1rem 0 2.2rem;overflow:hidden}
.alerts-head{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.2rem;background:var(--red-bg);border-bottom:1px solid var(--red-line)}
.alerts-head h2{margin:0;font-size:1.15rem;flex:1}
.count{min-width:2rem;height:2rem;border-radius:99px;background:var(--red);color:#fff;font-weight:700;display:grid;place-items:center;padding:0 .6rem}
.count.zero{background:#2e9e5b}
.alert-list{list-style:none;margin:0;padding:0}
.alert-list li{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;border-top:1px solid var(--line)}
.alert-list li:first-child{border-top:0}
.dot{width:.8rem;height:.8rem;border-radius:50%;background:var(--red);flex:none;animation:pulse 2s ease-out 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,45,32,.5)}100%{box-shadow:0 0 0 10px rgba(217,45,32,0)}}
.alert-text{flex:1}
.alert-text small{display:block;color:var(--muted)}
.tag{font-size:.8rem;font-weight:700;color:var(--red);background:var(--red-bg);border:1px solid var(--red-line);border-radius:99px;padding:0 .6rem;white-space:nowrap}
.link-btn{background:none;border:1px solid var(--line);color:var(--sky-600);border-radius:10px;padding:.2rem .8rem;font-weight:500}
.link-btn:hover{background:var(--sky-50);color:var(--sky-800)}
.empty{padding:1.2rem;color:var(--muted);text-align:center}

/* Hub and spokes */
.hub{position:relative;display:grid;gap:1.4rem;grid-template-columns:repeat(3,1fr);padding-top:4.2rem}
.hub-core{position:absolute;top:0;inset-inline:0;margin-inline:auto;width:5.4rem;height:5.4rem;border-radius:50%;
  background:var(--sky-600);color:#fff;display:grid;place-items:center;font-size:2.2rem;box-shadow:var(--shadow);z-index:1}
.hub::before{content:"";position:absolute;top:5.4rem;inset-inline:16.6%;height:2.1rem;border:2px dashed var(--sky-600);
  border-bottom:0;border-radius:24px 24px 0 0;opacity:.45}
.portal{position:relative;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;
  padding:1.6rem 1.4rem;color:var(--text);box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.portal:hover{transform:translateY(-4px);border-color:var(--sky-600)}
.portal .ico{font-size:2.2rem;line-height:1}
.portal h3{margin:.7rem 0 .3rem;font-size:1.3rem;color:var(--sky-800)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .portal h3{color:#7cc8f2}}
.portal p{margin:0;color:var(--muted);font-size:.95rem}
.portal .badge{position:absolute;top:1rem;inset-inline-end:1rem}

/* Module views */
.back{display:inline-flex;align-items:center;gap:.5rem;background:var(--sky-600);color:#fff;border:0;border-radius:14px;
  padding:.7rem 1.4rem;font-size:1.05rem;font-weight:700;box-shadow:var(--shadow)}
.back:hover{background:var(--sky-800)}
.module-title{display:flex;align-items:center;gap:.8rem;margin:1.6rem 0 1rem}
.module-title h2{margin:0;font-size:1.7rem;color:var(--sky-800)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .module-title h2{color:#7cc8f2}}
.placeholder{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:1.4rem}
.placeholder h3{margin:0 0 .6rem}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;margin:0;padding:0;list-style:none}
.chips li{background:var(--sky-50);color:var(--sky-800);border-radius:99px;padding:.2rem 1rem;font-weight:500}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chips li{background:#16405c;color:#cfe9f8}}
.mini{margin-top:1.2rem;display:grid;gap:.5rem}
.mini div{display:flex;justify-content:space-between;gap:1rem;padding:.5rem .8rem;background:var(--bg-top);border-radius:10px}

[hidden]{display:none!important}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:1.2rem;box-shadow:var(--shadow);margin-bottom:1.2rem}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem}
.tab{display:inline-flex;align-items:center;gap:.5rem;background:var(--surface);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:.55rem 1.1rem;font-weight:700}
.tab.on{background:var(--sky-600);border-color:var(--sky-600);color:#fff}
.count.sm{min-width:1.5rem;height:1.5rem;font-size:.8rem;padding:0 .4rem}
.note{background:var(--sky-50);color:var(--sky-800);border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem;font-weight:500}
.form{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));align-items:end}
.field{display:grid;gap:.3rem;font-weight:500}
.field input,.field select{font:inherit;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);width:100%}
.primary{grid-column:1/-1;justify-self:start;background:var(--sky-600);color:#fff;border:0;border-radius:12px;padding:.7rem 1.6rem;font-weight:700}
.primary:hover{background:var(--sky-800)}
.primary:disabled{opacity:.5;cursor:not-allowed}
.table-wrap{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:.7rem .9rem;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--bg-top);font-weight:700}
tr.low td{background:var(--red-bg)}
.stepper{display:inline-flex;align-items:center;gap:.6rem}
.stepper button{width:2rem;height:2rem;border-radius:50%;border:1.5px solid var(--sky-600);background:var(--surface);color:var(--sky-600);font-size:1.2rem;font-weight:700;line-height:1}
.stepper button:hover:not(:disabled){background:var(--sky-600);color:#fff}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper strong{min-width:2rem;text-align:center}
.pill{display:inline-block;border-radius:99px;padding:0 .8rem;font-weight:700;font-size:.9rem}
.pill.out{background:#fff4d6;color:#8a5200;border:1px solid #f0cf85}
.pill.in{background:#dcf5e6;color:#17663a;border:1px solid #9ad8b3}
.pill.low{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.pill.ok{background:#dcf5e6;color:#17663a;border:1px solid #9ad8b3}
.sec-title{margin:1.6rem 0 .8rem;font-size:1.2rem}
@media (max-width:820px){
  .hub{grid-template-columns:1fr;padding-top:0}
  .hub-core,.hub::before{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="site-header">
  <h1>وحي السماء</h1>
  <p class="en">Wahi Al-Samaa</p>
</header>

<main>
  <!-- Main dashboard -->
  <section id="view-home" class="view" aria-labelledby="alerts-title">
    <div class="alerts" role="region" aria-live="polite">
      <div class="alerts-head">
        <span aria-hidden="true">🔴</span>
        <h2 id="alerts-title">مركز التنبيهات</h2>
        <span class="count" id="alert-count">0</span>
      </div>
      <ul class="alert-list" id="alert-list"></ul>
    </div>

    <nav class="hub" aria-label="الأقسام">
      <div class="hub-core" aria-hidden="true">📖</div>
      <button class="portal" data-go="warehouse">
        <span class="ico" aria-hidden="true">📦</span>
        <h3>إدارة المستودع والعهد</h3>
        <p>الأصول والمعدات والمخزون والاستعارات</p>
        <span class="count badge" id="badge-warehouse" hidden>0</span>
      </button>
      <button class="portal" data-go="kitchen">
        <span class="ico" aria-hidden="true">☕</span>
        <h3>المطبخ والضيافة</h3>
        <p>مستلزمات الضيافة وتواريخ الانتهاء</p>
        <span class="count badge" id="badge-kitchen" hidden>0</span>
      </button>
      <button class="portal" data-go="quran">
        <span class="ico" aria-hidden="true">🕌</span>
        <h3>خطة حفظ القرآن</h3>
        <p>متابعة الطلاب والحفظ والمراجعة</p>
        <span class="count badge" id="badge-quran" hidden>0</span>
      </button>
    </nav>
  </section>

  <!-- Module views -->
  <section id="view-warehouse" class="view" hidden></section>
  <section id="view-kitchen" class="view" hidden></section>
  <section id="view-quran" class="view" hidden></section>
</main>

<script>
(function(){
  "use strict";
  var DAY = 86400000;
  function daysFromNow(n){ return Date.now() + n*DAY; }

  /* Sample data: replace with a real database later */
  var state = {
    view: "home",
    items: [
      {id:1, module:"warehouse", name:"كراسي القاعة", cat:"أثاث", qty:4, min:10, loc:"المستودع الخلفي، الصف الأول"},
      {id:2, module:"warehouse", name:"مصاحف احتياطية", cat:"كتب ومصاحف", qty:55, min:20, loc:"الرف العلوي، الزاوية اليسرى"},
      {id:6, module:"warehouse", name:"جهاز عرض", cat:"أجهزة إلكترونية", qty:2, min:1, loc:"الخزانة الحديدية"},
      {id:7, module:"warehouse", name:"مكبر صوت", cat:"معدات صوتية", qty:1, min:2, loc:"الرف الأوسط"},
      {id:3, module:"kitchen",   name:"أكواب ورقية", qty:12, min:50},
      {id:4, module:"kitchen",   name:"تمر سكري", qty:8, min:5, expires:daysFromNow(-3)},
      {id:5, module:"kitchen",   name:"حليب طويل الأجل", qty:20, min:10, expires:daysFromNow(90)}
    ],
    loans: [
      {id:1, itemId:6, qty:1, who:"أ. خالد", dest:"قاعة الدرس 2", date:daysFromNow(-5), returnedOn:null},
      {id:2, itemId:7, qty:1, who:"أ. سعد", dest:"المسجد", date:daysFromNow(-2), returnedOn:null},
      {id:3, itemId:2, qty:5, who:"أ. ماجد", dest:"حلقة الفجر", date:daysFromNow(-10), returnedOn:daysFromNow(-8)}
    ],
    students: [
      {id:1, name:"طالب تجريبي ١", plan:"جزء عمّ", progress:60},
      {id:2, name:"طالب تجريبي ٢", plan:"سورة البقرة", progress:25}
    ]
  };

  var MODULES = {
    warehouse:{ title:"إدارة المستودع والعهد", icon:"📦",
      chips:["الأصول والمعدات","المخزون","الاستعارة والإرجاع","الجرد"],
      note:"هنا ستُضاف قائمة الأصول ونموذج الاستعارة وسجل الجرد." },
    kitchen:{ title:"المطبخ والضيافة", icon:"☕",
      chips:["مستلزمات الضيافة","تواريخ الانتهاء","الحد الأدنى للمخزون","قائمة المشتريات"],
      note:"هنا ستُضاف قائمة المستلزمات وتتبع الصلاحية وقائمة الشراء." },
    quran:{ title:"خطة حفظ القرآن", icon:"🕌",
      chips:["الطلاب","خطة الحفظ","المراجعة","التقارير"],
      note:"هنا ستُضاف ملفات الطلاب وخطة الحفظ اليومية وسجل المراجعة." }
  };

  function fmtDays(ms){
    var d = Math.round(Math.abs(ms - Date.now())/DAY);
    return d === 0 ? "اليوم" : (d === 1 ? "يوم واحد" : (d === 2 ? "يومان" : d + (d < 11 ? " أيام" : " يومًا")));
  }

  /* Build alert list from live state */
  function computeAlerts(){
    var out = [], now = Date.now();
    state.items.forEach(function(it){
      if(it.expires && it.expires < now)
        out.push({module:it.module, tag:"منتهي الصلاحية", text:it.name, sub:"انتهت منذ " + fmtDays(it.expires)});
      if(it.qty < it.min)
        out.push({module:it.module, tag:"مخزون منخفض", text:it.name, sub:"المتوفر " + it.qty + " والحد الأدنى " + it.min});
    });
    state.loans.forEach(function(l){
      if(!l.returnedOn)
        out.push({module:"warehouse", tag:"عهدة غير مُرجعة", text:itemName(l.itemId) + " × " + l.qty, sub:"عند " + l.who + " (" + l.dest + ") · " + ((now - l.date) < DAY ? "اليوم" : "منذ " + fmtDays(l.date))});
    });
    return out;
  }

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined) n.textContent = text;
    return n;
  }

  function renderAlerts(){
    var alerts = computeAlerts();
    var list = document.getElementById("alert-list");
    var count = document.getElementById("alert-count");
    list.textContent = "";
    count.textContent = alerts.length;
    count.classList.toggle("zero", alerts.length === 0);
    if(!alerts.length){
      list.appendChild(el("li","empty","لا توجد تنبيهات حاليًا"));
    }
    alerts.forEach(function(a){
      var li = el("li");
      li.appendChild(el("span","dot"));
      var box = el("div","alert-text");
      box.appendChild(el("strong","",a.text));
      box.appendChild(el("small","",a.sub));
      li.appendChild(box);
      li.appendChild(el("span","tag",a.tag));
      var btn = el("button","link-btn","فتح");
      btn.addEventListener("click", function(){ go(a.module); });
      li.appendChild(btn);
      list.appendChild(li);
    });
    Object.keys(MODULES).forEach(function(m){
      var n = alerts.filter(function(a){ return a.module === m; }).length;
      var b = document.getElementById("badge-" + m);
      b.hidden = n === 0; b.textContent = n;
    });
  }

  function renderModule(key){
    var m = MODULES[key], root = document.getElementById("view-" + key);
    root.textContent = "";
    var back = el("button","back","→ العودة للرئيسية");
    back.addEventListener("click", function(){ go("home"); });
    root.appendChild(back);

    var title = el("div","module-title");
    title.appendChild(el("span","",m.icon));
    title.appendChild(el("h2","",m.title));
    root.appendChild(title);

    if(key === "warehouse"){ renderWarehouse(root); return; }
    var box = el("div","placeholder");
    box.appendChild(el("h3","","الأقسام القادمة"));
    var chips = el("ul","chips");
    m.chips.forEach(function(c){ chips.appendChild(el("li","",c)); });
    box.appendChild(chips);
    box.appendChild(el("p","",m.note));

    var mini = el("div","mini");
    if(key === "quran"){
      state.students.forEach(function(s){
        var r = el("div"); r.appendChild(el("span","",s.name + " · " + s.plan)); r.appendChild(el("strong","",s.progress + "%")); mini.appendChild(r);
      });
    } else {
      state.items.filter(function(i){ return i.module === key; }).forEach(function(i){
        var r = el("div"); r.appendChild(el("span","",i.name)); r.appendChild(el("strong","",String(i.qty))); mini.appendChild(r);
      });
    }
    box.appendChild(mini);
    root.appendChild(box);
  }

  /* ---------- Warehouse module ---------- */
  function itemName(id){ var f = findItem(id); return f ? f.name : "—"; }
  function findItem(id){ return state.items.filter(function(i){ return i.id === id; })[0]; }
  function nextId(arr){ return arr.reduce(function(m,x){ return Math.max(m, x.id); }, 0) + 1; }
  function save(){ try{ localStorage.setItem("wahi_v1", JSON.stringify({items:state.items, loans:state.loans})); }catch(e){} }
  try{ var saved = JSON.parse(localStorage.getItem("wahi_v1") || "null"); if(saved && saved.items && saved.loans){ state.items = saved.items; state.loans = saved.loans; } }catch(e){}
  function dstr(ms){ var d = new Date(ms); return d.getFullYear() + "-" + ("0" + (d.getMonth()+1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function field(label, ctl){ var l = el("label","field"); l.appendChild(el("span","",label)); l.appendChild(ctl); return l; }
  function input(type, name, attrs){ var i = document.createElement("input"); i.type = type; i.name = name; i.required = true; Object.keys(attrs || {}).forEach(function(k){ i.setAttribute(k, attrs[k]); }); return i; }
  function tr(cells, head){ var r = document.createElement("tr"); cells.forEach(function(c){ var d = document.createElement(head ? "th" : "td"); if(typeof c === "string") d.textContent = c; else d.appendChild(c); r.appendChild(d); }); return r; }
  function tableOf(headers){ var w = el("div","table-wrap card"), t = document.createElement("table"), h = document.createElement("thead"), b = document.createElement("tbody"); h.appendChild(tr(headers, true)); t.appendChild(h); t.appendChild(b); w.appendChild(t); return {wrap:w, body:b}; }

  function renderWarehouse(root){
    var tab = state.wTab || "list", note = "";
    var tabs = el("div","tabs"), body = el("div","wh-body"), btns = {};
    tabs.setAttribute("role","tablist");
    [["add","إضافة عنصر"],["list","قائمة المستودع"],["lend","الاستعارة والعهد"]].forEach(function(d){
      var b = el("button","tab"); b.type = "button"; b.setAttribute("role","tab");
      b.appendChild(el("span","",d[1])); b.appendChild(el("span","count sm","0"));
      b.addEventListener("click", function(){ tab = d[0]; state.wTab = d[0]; note = ""; draw(); });
      btns[d[0]] = b; tabs.appendChild(b);
    });
    root.appendChild(tabs); root.appendChild(body);

    function setBadge(b, n){ var s = b.lastChild; s.textContent = n; s.hidden = (n === 0); }
    function badges(){
      var al = computeAlerts().filter(function(a){ return a.module === "warehouse"; });
      setBadge(btns.list, al.filter(function(a){ return a.tag === "مخزون منخفض"; }).length);
      setBadge(btns.lend, al.filter(function(a){ return a.tag === "عهدة غير مُرجعة"; }).length);
      Object.keys(btns).forEach(function(k){ btns[k].classList.toggle("on", k === tab); btns[k].setAttribute("aria-selected", k === tab); });
    }
    function draw(){
      body.textContent = ""; badges();
      if(note){ var n = el("div","note",note); n.setAttribute("role","status"); body.appendChild(n); }
      if(tab === "add") drawAdd(); else if(tab === "lend") drawLend(); else drawList();
    }

    function drawAdd(){
      var f = document.createElement("form"); f.className = "card form";
      var dl = document.createElement("datalist"); dl.id = "cats";
      ["معدات صوتية","قرطاسية","أثاث","أجهزة إلكترونية","مستلزمات نظافة"].forEach(function(c){ var o = document.createElement("option"); o.value = c; dl.appendChild(o); });
      var name = input("text","name"), cat = input("text","cat",{list:"cats"}),
          qty = input("number","qty",{min:0,step:1}), min = input("number","min",{min:0,step:1}),
          loc = input("text","loc",{placeholder:"مثال: الرف العلوي، الزاوية اليسرى"});
      f.appendChild(field("اسم العنصر", name)); f.appendChild(field("التصنيف", cat)); f.appendChild(dl);
      f.appendChild(field("الكمية الإجمالية", qty)); f.appendChild(field("حد الأمان", min));
      f.appendChild(field("موقع العنصر", loc));
      var s = el("button","primary","حفظ العنصر"); s.type = "submit"; f.appendChild(s);
      f.addEventListener("submit", function(e){
        e.preventDefault();
        var nm = name.value.trim();
        state.items.push({id:nextId(state.items), module:"warehouse", name:nm, cat:cat.value.trim(), qty:+qty.value, min:+min.value, loc:loc.value.trim()});
        save(); note = "تمت إضافة «" + nm + "» إلى المستودع"; tab = state.wTab = "list"; draw();
      });
      body.appendChild(f);
    }

    function drawList(){
      var items = state.items.filter(function(i){ return i.module === "warehouse"; });
      if(!items.length){ body.appendChild(el("div","empty card","المستودع فارغ. أضف أول عنصر من تبويب «إضافة عنصر».")); return; }
      var t = tableOf(["العنصر","التصنيف","الكمية","حد الأمان","الموقع","الحالة"]);
      items.forEach(function(it){
        var st = el("div","stepper"), minus = el("button","","−"), plus = el("button","","+");
        minus.type = plus.type = "button";
        minus.setAttribute("aria-label","إنقاص كمية " + it.name); plus.setAttribute("aria-label","زيادة كمية " + it.name);
        minus.disabled = it.qty <= 0;
        minus.addEventListener("click", function(){ it.qty = Math.max(0, it.qty - 1); save(); draw(); });
        plus.addEventListener("click", function(){ it.qty += 1; save(); draw(); });
        st.appendChild(minus); st.appendChild(el("strong","",String(it.qty))); st.appendChild(plus);
        var low = it.qty < it.min;
        var row = tr([it.name, it.cat || "—", st, String(it.min), it.loc || "—", el("span","pill " + (low ? "low" : "ok"), low ? "منخفض 🔴" : "جيد")]);
        if(low) row.className = "low";
        t.body.appendChild(row);
      });
      body.appendChild(t.wrap);
    }

    function drawLend(){
      var avail = state.items.filter(function(i){ return i.module === "warehouse" && i.qty > 0; });
      var f = document.createElement("form"); f.className = "card form";
      var sel = document.createElement("select"); sel.name = "item"; sel.required = true;
      avail.forEach(function(i){ var o = document.createElement("option"); o.value = i.id; o.textContent = i.name + " (المتوفر " + i.qty + ")"; sel.appendChild(o); });
      var who = input("text","who"), qty = input("number","qty",{min:1,step:1,value:1}),
          dest = input("text","dest",{placeholder:"مثال: قاعة الدرس 2"}), date = input("date","date",{value:dstr(Date.now())});
      function cap(){ var it = findItem(+sel.value); if(it) qty.setAttribute("max", it.qty); }
      sel.addEventListener("change", cap); cap();
      f.appendChild(field("العنصر", sel)); f.appendChild(field("اسم المستعير", who));
      f.appendChild(field("العدد", qty)); f.appendChild(field("المكان", dest)); f.appendChild(field("التاريخ", date));
      var s = el("button","primary","تسجيل الاستعارة"); s.type = "submit"; s.disabled = !avail.length; f.appendChild(s);
      if(!avail.length) f.appendChild(el("p","empty","لا توجد عناصر متوفرة للاستعارة حاليًا."));
      f.addEventListener("submit", function(e){
        e.preventDefault();
        var it = findItem(+sel.value), q = +qty.value;
        if(!it || q < 1 || q > it.qty){ note = "العدد المطلوب أكبر من المتوفر"; draw(); return; }
        it.qty -= q;
        state.loans.push({id:nextId(state.loans), itemId:it.id, qty:q, who:who.value.trim(), dest:dest.value.trim(), date:new Date(date.value + "T00:00:00").getTime(), returnedOn:null});
        save(); note = "تم تسجيل العهدة على " + who.value.trim(); draw();
      });
      body.appendChild(f);

      body.appendChild(el("h3","sec-title","سجل الاستعارة"));
      var loans = state.loans.slice().sort(function(a,b){
        return (!!a.returnedOn - !!b.returnedOn) || (b.date - a.date);
      });
      if(!loans.length){ body.appendChild(el("div","empty card","لا توجد عمليات استعارة بعد.")); return; }
      var t = tableOf(["العنصر","المستعير","العدد","المكان","التاريخ","الحالة","الإجراء"]);
      loans.forEach(function(l){
        var done = !!l.returnedOn, act;
        if(done){ act = el("span","","—"); }
        else {
          act = el("button","link-btn","تم الإرجاع"); act.type = "button";
          act.addEventListener("click", function(){
            l.returnedOn = Date.now();
            var it = findItem(l.itemId); if(it) it.qty += l.qty;
            save(); note = "تم إرجاع «" + itemName(l.itemId) + "» من " + l.who; draw();
          });
        }
        t.body.appendChild(tr([itemName(l.itemId), l.who, String(l.qty), l.dest, dstr(l.date),
          el("span","pill " + (done ? "in" : "out"), done ? "أُرجع 🟢" : "مُستعار ⏳"), act]));
      });
      body.appendChild(t.wrap);
    }
    draw();
  }

  /* Smooth view switching, with hash links like #warehouse */
  function show(view){
    state.view = view;
    ["home","warehouse","kitchen","quran"].forEach(function(v){
      document.getElementById("view-" + v).hidden = (v !== view);
    });
    if(view === "home") renderAlerts(); else renderModule(view);
    window.scrollTo({top:0, behavior: window.matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"});
  }
  function go(view){
    try{ location.hash = view === "home" ? "" : view; }catch(e){}
    show(view);
  }
  function fromHash(){
    var h = (location.hash || "").replace("#","");
    show(MODULES[h] ? h : "home");
  }

  document.querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-go")); });
  });
  window.addEventListener("hashchange", fromHash);
  fromHash();
  setInterval(function(){ if(state.view === "home") renderAlerts(); }, 60000);
})();
</script>
</body>
</html>
