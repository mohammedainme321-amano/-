<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وحي السماء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--sky:#0284c7;--sky-d:#075985;--sky-l:#e0f2fe;--surface:#fff;--text:#0c2a3f;--muted:#4b6a80;--line:#bae0f5;--red:#d92d20;--red-bg:#fff1f0;--red-line:#f7b4ae;--shadow:0 6px 24px rgba(2,132,199,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Tajawal",system-ui,Tahoma,Arial,sans-serif;color:var(--text);background:#fff linear-gradient(180deg,#e0f2fe 0%,#fff 70%) no-repeat;line-height:1.7}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.site-header{text-align:center;padding:2.5rem 1rem 1rem}
.site-header h1{margin:0;font-size:clamp(2.4rem,7vw,3.6rem);font-weight:800;color:var(--sky-d)}
.site-header .en{margin:0;font-size:1.05rem;font-weight:500;color:var(--sky);direction:ltr}
main{max-width:1040px;margin:0 auto;padding:1rem 1rem 3rem}
.msg{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red-line);border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem;font-weight:500}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:1.2rem;box-shadow:var(--shadow);margin-bottom:1.2rem}
.alerts{background:var(--surface);border:1.5px solid var(--red-line);border-radius:18px;box-shadow:var(--shadow);margin:1rem 0 2.2rem;overflow:hidden}
.alerts-head{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.2rem;background:var(--red-bg);border-bottom:1px solid var(--red-line)}
.alerts-head h2{margin:0;font-size:1.15rem;flex:1}
.count{min-width:2rem;height:2rem;border-radius:99px;background:var(--red);color:#fff;font-weight:700;display:grid;place-items:center;padding:0 .6rem}
.count.zero{background:#2e9e5b}
.count.sm{min-width:1.5rem;height:1.5rem;font-size:.8rem;padding:0 .4rem}
.alert-list{list-style:none;margin:0;padding:0}
.alert-list li{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;border-top:1px solid var(--line)}
.alert-list li:first-child{border-top:0}
.dot{width:.8rem;height:.8rem;border-radius:50%;background:var(--red);flex:none}
.alert-text{flex:1}.alert-text small{display:block;color:var(--muted)}
.tag{font-size:.8rem;font-weight:700;color:var(--red);background:var(--red-bg);border:1px solid var(--red-line);border-radius:99px;padding:0 .6rem;white-space:nowrap}
.link-btn{background:none;border:1px solid var(--line);color:var(--sky);border-radius:10px;padding:.15rem .8rem;font-weight:500}
.link-btn:hover{background:var(--sky-l);color:var(--sky-d)}
.link-btn.danger{color:var(--red);border-color:var(--red-line)}
.empty{padding:1.2rem;color:var(--muted);text-align:center}
.hub{position:relative;display:grid;gap:1.2rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));padding-top:4.2rem}
.hub-core{position:absolute;top:0;inset-inline:0;margin-inline:auto;width:5.4rem;height:5.4rem;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-size:2.2rem;box-shadow:var(--shadow)}
.portal{position:relative;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:1.5rem 1.3rem;color:var(--text);box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.portal:hover{transform:translateY(-4px);border-color:var(--sky)}
.portal .ico{font-size:2.1rem;line-height:1}
.portal h3{margin:.6rem 0 .2rem;font-size:1.25rem;color:var(--sky-d)}
.portal p{margin:0;color:var(--muted);font-size:.93rem}
.portal .count{position:absolute;top:1rem;inset-inline-end:1rem}
.back{display:inline-flex;align-items:center;gap:.5rem;background:var(--sky);color:#fff;border:0;border-radius:14px;padding:.7rem 1.4rem;font-size:1.05rem;font-weight:700;box-shadow:var(--shadow)}
.back:hover{background:var(--sky-d)}
.module-title{display:flex;align-items:center;gap:.8rem;margin:1.4rem 0 1rem}
.module-title h2{margin:0;font-size:1.7rem;color:var(--sky-d)}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem}
.tab{display:inline-flex;align-items:center;gap:.5rem;background:var(--surface);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:.55rem 1.1rem;font-weight:700}
.tab.on{background:var(--sky);border-color:var(--sky);color:#fff}
.note{background:var(--sky-l);color:var(--sky-d);border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem;font-weight:500}
.form{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));align-items:end}
.field{display:grid;gap:.3rem;font-weight:500}
.field input,.field select,.search{font:inherit;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);width:100%}
.search{margin-bottom:1rem}
.primary{background:var(--sky);color:#fff;border:0;border-radius:12px;padding:.7rem 1.6rem;font-weight:700;justify-self:start}
.primary:hover{background:var(--sky-d)}.primary:disabled{opacity:.5;cursor:not-allowed}
.table-wrap{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:.7rem .9rem;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--sky-l);font-weight:700}
tr.low td{background:var(--red-bg)}
.stepper{display:inline-flex;align-items:center;gap:.6rem}
.stepper button{width:2rem;height:2rem;border-radius:50%;border:1.5px solid var(--sky);background:#fff;color:var(--sky);font-size:1.2rem;font-weight:700;line-height:1}
.stepper button:hover:not(:disabled){background:var(--sky);color:#fff}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper strong{min-width:2rem;text-align:center}
.acts{display:inline-flex;gap:.4rem}
.pill{display:inline-block;border-radius:99px;padding:0 .8rem;font-weight:700;font-size:.9rem;margin-inline-end:.3rem}
.pill.out{background:#fff4d6;color:#8a5200;border:1px solid #f0cf85}
.pill.ok,.pill.in{background:#dcf5e6;color:#17663a;border:1px solid #9ad8b3}
.pill.low{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.sec-title{margin:1.6rem 0 .8rem;font-size:1.2rem}
</style>
</head>
<body>
<header class="site-header">
  <h1>وحي السماء</h1>
  <p class="en">Wahi Al-Samaa</p>
</header>
<main>
  <div id="msg" class="msg" role="alert" hidden></div>
  <section id="view-home">
    <div class="alerts" role="region" aria-live="polite">
      <div class="alerts-head">
        <span aria-hidden="true">🔴</span>
        <h2>مركز التنبيهات</h2>
        <button class="link-btn" id="refresh" type="button">تحديث</button>
        <span class="count" id="alert-count">0</span>
      </div>
      <ul class="alert-list" id="alert-list"><li class="empty">جارٍ التحميل...</li></ul>
    </div>
    <nav class="hub" id="hub" aria-label="الأقسام"><div class="hub-core" aria-hidden="true">📖</div></nav>
  </section>
  <section id="view-mod" hidden></section>
</main>

<script>
(function(){
"use strict";
let supabase;
try{ supabase = window.supabase.createClient('https://copvxmmfifdjdqsotxrc.supabase.co','sb_publishable_C9SD2WS5j3ch2mcwTRmPBQ_jyGFxKWx'); }catch(e){}

const DAY = 864e5, UNRET = "عهدة غير مُرجعة";
const TABLES = ["items","loans","kitchen_items","books","students"];
const S = {data:{items:[],loans:[],kitchen_items:[],books:[],students:[]}, tab:{}, edit:null, q:""};
const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0,10);
function el(t,c,x){ const n = document.createElement(t); if(c) n.className = c; if(x !== undefined) n.textContent = x; return n; }

/* ---------- Entity definitions (each key = Supabase table) ---------- */
const ENT = {
  items:{cols:[
    {k:"name",l:"العنصر",t:"text",req:1},
    {k:"category",l:"التصنيف",t:"text",list:["معدات صوتية","قرطاسية","أثاث","أجهزة إلكترونية","مستلزمات نظافة"]},
    {k:"qty",l:"الكمية",t:"number",req:1,step:1,def:0},
    {k:"min_qty",l:"حد الأمان",t:"number",req:1,def:0},
    {k:"location",l:"موقع العنصر",t:"text",ph:"مثال: الرف العلوي، الزاوية اليسرى"}]},
  kitchen_items:{cols:[
    {k:"name",l:"العنصر",t:"text",req:1},
    {k:"category",l:"التصنيف",t:"text",list:["مواد غذائية","مشروبات","أدوات ضيافة","أجهزة"]},
    {k:"qty",l:"الكمية",t:"number",req:1,step:1,def:0},
    {k:"min_qty",l:"حد الأمان",t:"number",req:1,def:0},
    {k:"expiry_date",l:"تاريخ الانتهاء",t:"date"},
    {k:"location",l:"الموقع",t:"text"}]},
  books:{cols:[
    {k:"title",l:"عنوان الكتاب",t:"text",req:1},
    {k:"author",l:"المؤلف",t:"text"},
    {k:"category",l:"التصنيف",t:"text",list:["تفسير","حديث","فقه","عقيدة","تجويد","سيرة","لغة عربية"]},
    {k:"shelf",l:"الرف",t:"text"},
    {k:"status",l:"الحالة",t:"select",opts:["متوفر","معار"],def:"متوفر"},
    {k:"borrower",l:"المستعير",t:"text"}]},
  students:{cols:[
    {k:"name",l:"اسم الطالب",t:"text",req:1},
    {k:"plan",l:"خطة الحفظ",t:"text",ph:"مثال: جزء عمّ"},
    {k:"progress",l:"نسبة الإنجاز %",t:"number",req:1,max:100,def:0},
    {k:"notes",l:"ملاحظات",t:"text"}]}
};
const MODS = {
  warehouse:{title:"إدارة المستودع والعهد",icon:"📦",ent:"items",lend:1,labels:["إضافة عنصر","قائمة المستودع"],desc:"الأصول والمخزون والاستعارات"},
  kitchen:{title:"المطبخ والضيافة",icon:"☕",ent:"kitchen_items",labels:["إضافة عنصر","قائمة المطبخ"],desc:"المستلزمات وتواريخ الانتهاء"},
  library:{title:"المكتبة",icon:"📚",ent:"books",labels:["إضافة كتاب","قائمة الكتب"],desc:"تصنيف الكتب والإعارة"},
  students:{title:"خطة حفظ القرآن",icon:"🕌",ent:"students",labels:["إضافة طالب","قائمة الطلاب"],desc:"متابعة الطلاب والحفظ"}
};

/* ---------- Supabase data layer ---------- */
async function refresh(){
  const res = await Promise.all(TABLES.map(t => supabase.from(t).select("*").order("id")));
  res.forEach((r,i) => { if(r.error) throw r.error; S.data[TABLES[i]] = r.data; });
}
async function run(fn){
  $("msg").hidden = true;
  try{ await fn(); return true; }
  catch(e){
    $("msg").textContent = "تعذر تنفيذ العملية: " + (e && e.message ? e.message : e) + " — تأكد من تشغيل ملف supabase-schema.sql في Supabase.";
    $("msg").hidden = false; return false;
  }
}
const ok = r => { if(r.error) throw r.error; };

/* ---------- Red alert engine (live Supabase data) ---------- */
function ago(d){ const n = Math.floor((Date.now() - new Date(d + "T00:00:00")) / DAY); return n < 1 ? "اليوم" : "منذ " + n + " يوم"; }
function alerts(){
  const a = [], d = S.data, t = today();
  const low = (m,i) => { if(i.qty < i.min_qty) a.push({m, tag:"مخزون منخفض", text:i.name, sub:"المتوفر " + i.qty + " والحد الأدنى " + i.min_qty}); };
  d.items.forEach(i => low("warehouse", i));
  d.kitchen_items.forEach(i => {
    low("kitchen", i);
    if(i.expiry_date && i.expiry_date < t) a.push({m:"kitchen", tag:"منتهي الصلاحية", text:i.name, sub:"انتهت في " + i.expiry_date});
  });
  d.loans.forEach(l => {
    if(l.returned_at) return;
    const it = d.items.find(x => x.id === l.item_id);
    a.push({m:"warehouse", tag:UNRET, text:(it ? it.name : "—") + " × " + l.qty, sub:"عند " + l.borrower + " (" + l.destination + ") · " + ago(l.loan_date)});
  });
  return a;
}
function flags(t,r){
  const f = [];
  if("min_qty" in r && r.qty < r.min_qty) f.push(["low","منخفض 🔴"]);
  if(r.expiry_date && r.expiry_date < today()) f.push(["low","منتهي 🔴"]);
  if(t === "books") f.push([r.status === "معار" ? "out" : "ok", r.status === "معار" ? "مُعار ⏳" : "متوفر"]);
  else if(t !== "students" && !f.length) f.push(["ok","جيد"]);
  return f;
}

/* ---------- Small UI helpers ---------- */
function row(cells){ const r = document.createElement("tr"); cells.forEach(c => { const d = document.createElement("td"); if(typeof c === "string") d.textContent = c; else d.appendChild(c); r.appendChild(d); }); return r; }
function table(heads){
  const t = document.createElement("table"), h = document.createElement("thead"), hr = document.createElement("tr"), b = document.createElement("tbody");
  heads.forEach(x => hr.appendChild(el("th","",x))); h.appendChild(hr); t.appendChild(h); t.appendChild(b);
  return {w:t, b};
}
function fieldEl(c,val){
  let i;
  if(c.t === "select"){ i = document.createElement("select"); c.opts.forEach(o => { const p = el("option","",o); p.value = o; i.appendChild(p); }); }
  else{
    i = document.createElement("input"); i.type = c.t;
    if(c.t === "number"){ i.min = 0; i.step = 1; if(c.max) i.max = c.max; }
    if(c.list) i.setAttribute("list","dl-" + c.k);
  }
  i.name = c.k; i.required = !!c.req; if(c.ph) i.placeholder = c.ph;
  if(val !== undefined && val !== null) i.value = val;
  const l = el("label","field"); l.appendChild(el("span","",c.l)); l.appendChild(i);
  if(c.list){ const dl = document.createElement("datalist"); dl.id = "dl-" + c.k; c.list.forEach(x => { const o = document.createElement("option"); o.value = x; dl.appendChild(o); }); l.appendChild(dl); }
  return {l, i};
}

/* ---------- Home ---------- */
function renderHome(){
  const al = alerts(), list = $("alert-list"), cnt = $("alert-count");
  list.textContent = ""; cnt.textContent = al.length; cnt.classList.toggle("zero", !al.length);
  if(!al.length) list.appendChild(el("li","empty","لا توجد تنبيهات حاليًا"));
  al.forEach(a => {
    const li = el("li"), box = el("div","alert-text");
    box.appendChild(el("strong","",a.text)); box.appendChild(el("small","",a.sub));
    li.appendChild(el("span","dot")); li.appendChild(box); li.appendChild(el("span","tag",a.tag));
    const b = el("button","link-btn","فتح"); b.type = "button"; b.onclick = () => go(a.m); li.appendChild(b);
    list.appendChild(li);
  });
  const hub = $("hub"); while(hub.children.length > 1) hub.removeChild(hub.lastChild);
  Object.keys(MODS).forEach(k => {
    const m = MODS[k], b = el("button","portal"); b.type = "button"; b.onclick = () => go(k);
    b.appendChild(el("span","ico",m.icon)); b.appendChild(el("h3","",m.title)); b.appendChild(el("p","",m.desc));
    const n = al.filter(a => a.m === k).length;
    if(n){ b.appendChild(el("span","count",String(n))); }
    hub.appendChild(b);
  });
}

/* ---------- Module view (add / list / lend tabs) ---------- */
function renderModule(key){
  const M = MODS[key], E = ENT[M.ent], root = $("view-mod");
  root.textContent = "";
  let tab = S.tab[key] || "list", note = "";
  const back = el("button","back","→ العودة للرئيسية"); back.type = "button"; back.onclick = () => go("home"); root.appendChild(back);
  const ti = el("div","module-title"); ti.appendChild(el("span","",M.icon)); ti.appendChild(el("h2","",M.title)); root.appendChild(ti);
  const tabs = el("div","tabs"), body = el("div"), bt = {};
  root.appendChild(tabs); root.appendChild(body);
  const defs = [["add",M.labels[0]],["list",M.labels[1]]]; if(M.lend) defs.push(["lend","الاستعارة والعهد"]);
  defs.forEach(d => {
    const b = el("button","tab"); b.type = "button"; b.setAttribute("role","tab");
    b.appendChild(el("span","",d[1])); b.appendChild(el("span","count sm","0"));
    b.onclick = () => { tab = S.tab[key] = d[0]; if(d[0] !== "add") S.edit = null; note = ""; draw(); };
    bt[d[0]] = b; tabs.appendChild(b);
  });
  const setB = (b,n) => { const s = b.lastChild; s.textContent = n; s.hidden = !n; };

  function draw(){
    body.textContent = "";
    const al = alerts().filter(a => a.m === key);
    setB(bt.list, al.filter(a => a.tag !== UNRET).length);
    if(bt.lend) setB(bt.lend, al.filter(a => a.tag === UNRET).length);
    Object.keys(bt).forEach(k => { bt[k].classList.toggle("on", k === tab); bt[k].setAttribute("aria-selected", k === tab); });
    if(note){ const n = el("div","note",note); n.setAttribute("role","status"); body.appendChild(n); }
    if(tab === "add") form(); else if(tab === "lend") lend(); else list();
  }

  /* CREATE / UPDATE */
  function form(){
    const row0 = S.edit && S.edit.ent === M.ent ? S.edit.row : null;
    const f = el("form","card form"), ins = [];
    E.cols.forEach(c => { const x = fieldEl(c, row0 ? row0[c.k] : c.def); ins.push([c, x.i]); f.appendChild(x.l); });
    const s = el("button","primary",row0 ? "حفظ التعديلات" : "حفظ"); s.type = "submit"; f.appendChild(s);
    if(row0){ const c = el("button","link-btn","إلغاء"); c.type = "button"; c.onclick = () => { S.edit = null; tab = S.tab[key] = "list"; draw(); }; f.appendChild(c); }
    f.onsubmit = async e => {
      e.preventDefault(); const o = {};
      ins.forEach(p => { const v = p[1].value.trim(); o[p[0].k] = p[0].t === "number" ? Number(v) : (v === "" ? null : v); });
      const done = await run(async () => {
        ok(row0 ? await supabase.from(M.ent).update(o).eq("id", row0.id) : await supabase.from(M.ent).insert(o));
        await refresh();
      });
      if(done){ note = row0 ? "تم تحديث السجل" : "تمت الإضافة بنجاح"; S.edit = null; tab = S.tab[key] = "list"; draw(); } else draw();
    };
    body.appendChild(f);
  }

  /* READ + quick stock update + DELETE */
  async function bump(r,d){
    if(r.qty + d < 0) return;
    if(await run(async () => { ok(await supabase.from(M.ent).update({qty:r.qty + d}).eq("id", r.id)); await refresh(); })) draw();
  }
  async function remove(r){
    if(!confirm("حذف هذا السجل نهائيًا؟")) return;
    if(await run(async () => { ok(await supabase.from(M.ent).delete().eq("id", r.id)); await refresh(); })){ note = "تم الحذف"; draw(); }
  }
  function stepper(r){
    const w = el("div","stepper"), m = el("button","","−"), p = el("button","","+");
    m.type = p.type = "button"; m.disabled = r.qty <= 0;
    m.setAttribute("aria-label","إنقاص الكمية"); p.setAttribute("aria-label","زيادة الكمية");
    m.onclick = () => bump(r,-1); p.onclick = () => bump(r,1);
    w.appendChild(m); w.appendChild(el("strong","",String(r.qty))); w.appendChild(p); return w;
  }
  function list(){
    const q = document.createElement("input"); q.type = "search"; q.className = "search"; q.placeholder = "بحث..."; q.value = S.q; body.appendChild(q);
    const wrap = el("div","table-wrap card"); body.appendChild(wrap);
    function paint(){
      wrap.textContent = ""; S.q = q.value.trim();
      const rows = S.data[M.ent].filter(r => !S.q || E.cols.some(c => String(r[c.k] == null ? "" : r[c.k]).includes(S.q)));
      if(!rows.length){ wrap.appendChild(el("div","empty","لا توجد سجلات")); return; }
      const t = table(E.cols.map(c => c.l).concat(["الحالة","إجراء"])); wrap.appendChild(t.w);
      rows.forEach(r => {
        const cells = E.cols.map(c => c.step ? stepper(r) : (r[c.k] == null ? "—" : (c.k === "progress" ? r[c.k] + "%" : String(r[c.k]))));
        const fl = flags(M.ent, r), st = el("span"); fl.forEach(x => st.appendChild(el("span","pill " + x[0], x[1])));
        const ac = el("span","acts"), e = el("button","link-btn","تعديل"), d = el("button","link-btn danger","حذف");
        e.type = d.type = "button";
        e.onclick = () => { S.edit = {ent:M.ent, row:r}; tab = S.tab[key] = "add"; draw(); };
        d.onclick = () => remove(r);
        ac.appendChild(e); ac.appendChild(d);
        const tr = row(cells.concat([st, ac])); if(fl.some(x => x[0] === "low")) tr.className = "low"; t.b.appendChild(tr);
      });
    }
    q.oninput = paint; paint();
  }

  /* Lending: stock changes via the database trigger */
  function lend(){
    const avail = S.data.items.filter(i => i.qty > 0);
    const f = el("form","card form"), sel = document.createElement("select"); sel.required = true;
    avail.forEach(i => { const o = el("option","",i.name + " (المتوفر " + i.qty + ")"); o.value = i.id; sel.appendChild(o); });
    const who = fieldEl({k:"borrower",l:"اسم المستعير",t:"text",req:1}), qty = fieldEl({k:"qty",l:"العدد",t:"number",req:1}, 1),
          dest = fieldEl({k:"destination",l:"المكان",t:"text",req:1,ph:"مثال: قاعة الدرس 2"}), dt = fieldEl({k:"loan_date",l:"التاريخ",t:"date",req:1}, today());
    qty.i.min = 1;
    const cap = () => { const it = S.data.items.find(x => x.id === +sel.value); if(it) qty.i.max = it.qty; };
    sel.onchange = cap; cap();
    const sl = el("label","field"); sl.appendChild(el("span","","العنصر")); sl.appendChild(sel);
    [sl, who.l, qty.l, dest.l, dt.l].forEach(x => f.appendChild(x));
    const s = el("button","primary","تسجيل الاستعارة"); s.type = "submit"; s.disabled = !avail.length; f.appendChild(s);
    if(!avail.length) f.appendChild(el("p","empty","لا توجد عناصر متوفرة للاستعارة حاليًا."));
    f.onsubmit = async e => {
      e.preventDefault();
      const it = S.data.items.find(x => x.id === +sel.value), n = Number(qty.i.value);
      if(!it || n < 1 || n > it.qty){ note = "العدد المطلوب أكبر من المتوفر"; draw(); return; }
      const done = await run(async () => {
        ok(await supabase.from("loans").insert({item_id:it.id, borrower:who.i.value.trim(), qty:n, destination:dest.i.value.trim(), loan_date:dt.i.value}));
        await refresh();
      });
      if(done) note = "تم تسجيل العهدة على " + who.i.value.trim();
      draw();
    };
    body.appendChild(f);

    body.appendChild(el("h3","sec-title","سجل الاستعارة"));
    const loans = S.data.loans.slice().sort((a,b) => (!!a.returned_at - !!b.returned_at) || String(b.loan_date).localeCompare(String(a.loan_date)));
    if(!loans.length){ body.appendChild(el("div","empty card","لا توجد عمليات استعارة بعد.")); return; }
    const wrap = el("div","table-wrap card"), t = table(["العنصر","المستعير","العدد","المكان","التاريخ","الحالة","الإجراء"]);
    wrap.appendChild(t.w); body.appendChild(wrap);
    loans.forEach(l => {
      const it = S.data.items.find(x => x.id === l.item_id), done = !!l.returned_at;
      let act = el("span","","—");
      if(!done){
        act = el("button","link-btn","تم الإرجاع"); act.type = "button";
        act.onclick = async () => {
          if(await run(async () => { ok(await supabase.from("loans").update({returned_at:new Date().toISOString()}).eq("id", l.id)); await refresh(); })){
            note = "تم إرجاع «" + (it ? it.name : "العنصر") + "» من " + l.borrower; draw();
          }
        };
      }
      t.b.appendChild(row([it ? it.name : "—", l.borrower, String(l.qty), l.destination, l.loan_date, el("span","pill " + (done ? "in" : "out"), done ? "أُرجع 🟢" : "مُستعار ⏳"), act]));
    });
  }
  draw();
}

/* ---------- Routing ---------- */
const route = () => { const h = location.hash.slice(1); return MODS[h] ? h : "home"; };
function show(v){
  const home = v === "home"; S.q = "";
  $("view-home").hidden = !home; $("view-mod").hidden = home;
  if(home) renderHome(); else renderModule(v);
  window.scrollTo(0,0);
}
function go(v){ const same = route() === v; location.hash = v === "home" ? "" : v; if(same) show(v); }
window.addEventListener("hashchange", () => show(route()));
$("refresh").onclick = async () => { await run(refresh); show(route()); };

(async function(){ await run(refresh); show(route()); })();
})();
</script>
</body>
</html>
